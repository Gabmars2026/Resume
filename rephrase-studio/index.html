<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rephrase Studio</title><style>html,body{margin:0;min-height:100%;font-family:system-ui;background:#f7f9f8;color:#18231f}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:520px;background:white;border:1px solid #dce4e0;border-radius:16px;padding:24px;box-shadow:0 16px 45px #17352b14}.spin{width:28px;height:28px;border:3px solid #dce4e0;border-top-color:#087a55;border-radius:50%;animation:s .8s linear infinite;margin-bottom:14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main><div class="card"><div class="spin"></div><b>Loading Rephrase Studio…</b><p>The audited paraphrasing workspace is starting.</p></div></main><script>(async()=>{try{if(!('DecompressionStream' in window))throw new Error('This browser needs a current version of Chrome, Edge, Firefox, or Safari.');const b64=(await fetch('https://raw.githubusercontent.com/Gabmars2026/Resume/d93c584c3ec31eb60ba4464224fc81680f3416c4/rephrase-studio/app.b64',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('Site package could not be loaded.');return r.text()})).trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.card').innerHTML='<b>Rephrase Studio could not start.</b><p>'+String(e.message||e)+'</p>'}})();</script></body></html>
